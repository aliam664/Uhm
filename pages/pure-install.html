<head>

  <title>بخش ۱ — نصب Pure | UHM Graphics Pack</title>
  <meta name="description" content="آموزش نصب خود ماد Pure برای پک گرافیکی UHM (Assetto Corsa).">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>window.UHM_BASE="../";</script>
</head>
<body data-page="pure-install" data-lang="fa">

  <div id="scroll-progress"></div>
  <div id="header-mount"></div>
  <div id="sidebar-mount"></div>

  <main class="guide-wrap">
    <div class="guide-head">
      <nav class="crumbs"><a href="../index.html">خانه</a><span class="sep">/</span><span>بخش ۱</span></nav>
      <h1 class="guide-title"><span class="g-num">01</span><span data-fa="نصب Pure" data-en="Install Pure"></span><span class="badge-video">▶ ویدیو</span></h1>
      <p class="guide-desc" data-fa="نصب خود ماد Pure (نه کانفیگ پک). این پایه‌ی همه‌چیز است — بدون آن گرافیک کار نمی‌کند." data-en="Install the Pure mod itself (not the pack config). This is the foundation — without it the graphics won't work."></p>
      <div class="guide-meta"><span class="chip blue" data-fa="پیش‌نیاز همه بخش‌ها" data-en="Prerequisite for all sections"></span></div>
    </div>

    <div class="guide-body">
      <div class="notice"><span class="n-ico">🎬</span><div><strong data-fa="ویدیوی آموزشی" data-en="Tutorial video"></strong>
        <span data-fa="همان ویدیوی اصلی آموزش نصب Pure از CDN پخش می‌شود." data-en="The original Pure install tutorial plays from CDN."></span></div></div>

      <div data-player tabindex="0">
        <div class="player-wrap">
          <video src="https://cdn.imgurl.ir/uploads/d525560_VID_20260729_234305_584.mp4" preload="metadata" playsinline></video>
          <div class="player-overlay"><div class="play-ico">▶</div><span data-fa="پخش ویدیوی آموزش" data-en="Play tutorial"></span></div>
          <div class="player-controls">
            <button class="pc-play" aria-label="play">▶</button>
            <div class="pc-seek"><div class="pc-fill"></div></div>
            <span class="pc-time">0:00 / 0:00</span>
            <button class="pc-mute" aria-label="mute">🔊</button>
            <button class="pc-fs" aria-label="fullscreen">⛶</button>
          </div>
        </div>
      </div>
      <div class="mt-3"><a class="btn btn-ghost btn-sm" href="https://cdn.imgurl.ir/uploads/d525560_VID_20260729_234305_584.mp4" target="_blank" rel="noopener"><span class="ico">↗</span><span data-fa="باز کردن ویدیو در تب جدید" data-en="Open video in new tab"></span></a></div>

      <h3 data-fa="مراحل نصب" data-en="Installation steps"></h3>
      <div class="steps">
        <div class="step"><div class="step-num">1</div><div class="step-body"><h4 data-fa="پیش‌نیاز" data-en="Prerequisite"></h4><p data-fa="Content Manager، CSP و یک‌بار اجرای بازی نصب باشد." data-en="Content Manager, CSP and run the game once."></p></div></div>
        <div class="step"><div class="step-num">2</div><div class="step-body"><h4 data-fa="دانلود Pure" data-en="Download Pure"></h4><p data-fa="از منبع معتبر (طبق ویدیو) نسخه آخر Pure را دانلود کن." data-en="Download the latest Pure from a trusted source (as in the video)."></p></div></div>
        <div class="step"><div class="step-num">3</div><div class="step-body"><h4 data-fa="نصب در Content Manager" data-en="Install in Content Manager"></h4><p data-fa="فایل را Drag &amp; Drop کن و گزینه Install را بزن؛ اگر Replace آمد، Replace را انتخاب کن." data-en="Drag & drop the file and hit Install; if Replace appears, choose Replace."></p></div></div>
        <div class="step"><div class="step-num">4</div><div class="step-body"><h4 data-fa="تست" data-en="Test"></h4><p data-fa="بازی را اجرا کن و از وجود پنل Pure مطمئن شو." data-en="Run the game and confirm the Pure panel is present."></p></div></div>
        <div class="step"><div class="step-num">5</div><div class="step-body"><h4 data-fa="قدم بعدی" data-en="Next step"></h4><p data-fa="برو به بخش ۲ (CSP Setting) و بعداً Pure Config پک را اعمال کن." data-en="Go to section 2 (CSP Setting), then apply the Pure Config pack later."></p></div></div>
      </div>

      <div class="warning"><span class="w-ico">⚠️</span><div><strong data-fa="نسخه قدیمی Pure" data-en="Old Pure version"></strong>
        <span data-fa="Pure قدیمی با پک UHM ناسازگار می‌شود — حتماً آخرین نسخه را نصب کن." data-en="Old Pure becomes incompatible with the UHM pack — always install the latest."></span></div></div>
    </div>

    <div id="pager-mount"></div>
  </main>

  <div id="footer-mount"></div>
  <button class="to-top" id="to-top" aria-label="برو بالا">↑</button>
  <div class="toast" id="toast"></div>

  <script src="../js/app.js"></script>
