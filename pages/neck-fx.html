<body data-page="neck-fx" data-lang="fa">

  <div id="scroll-progress"></div>

  <div id="sidebar-mount"></div>

  <main class="guide-wrap">
    <div class="guide-head">
      <nav class="crumbs"><a href="../index.html">خانه</a><span class="sep">/</span><span>بخش ۹</span></nav>
      <h1 class="guide-title"><span class="g-num">09</span><span data-fa="Neck FX" data-en="Neck FX"></span><span class="badge-photo">🖼 با عکس</span></h1>
      <p class="guide-desc" data-fa="افکت حرکتی سر راننده داخل کابین (acstuff)." data-en="Driver head-movement effect in the cockpit (acstuff)."></p>
      <div class="guide-meta"><a class="chip blue en" href="https://acstuff.ru/s/VRDXD1" target="_blank" rel="noopener">🔗 acstuff.ru/s/VRDXD1</a></div>
    </div>

    <div class="guide-body">
      <h3 data-fa="مراحل نصب" data-en="Installation steps"></h3>
      <div class="steps">
        <div class="step"><div class="step-num">1</div><div class="step-body"><h4 data-fa="باز کردن لینک" data-en="Open the link"></h4><p data-fa="لینک نصب را باز کن:" data-en="Open the install link:"></p>
          <div class="path-box"><code id="nf-link" data-full="https://acstuff.ru/s/VRDXD1">https://acstuff.ru/s/VRDXD1</code><button class="copy-btn" data-copy="#nf-link">📋</button></div>
        </div></div>
        <div class="step"><div class="step-num">2</div><div class="step-body"><h4 data-fa="Open in Content Manager" data-en="Open in Content Manager"></h4><p data-fa="روی گزینه Open in Content Manager بزن." data-en="Click Open in Content Manager."></p></div></div>
        <div class="step"><div class="step-num">3</div><div class="step-body"><h4 data-fa="Save &amp; Apply" data-en="Save & Apply"></h4><p data-fa="بعد از باز شدن Content Manager، گزینه Save &amp; Apply را بزن." data-en="Once Content Manager opens, click Save & Apply."></p></div></div>
        <div class="step"><div class="step-num">4</div><div class="step-body"><h4 data-fa="فعال‌سازی در CSP" data-en="Enable in CSP"></h4><p data-fa="این مسیر را باز کن:" data-en="Open this path:"></p>
          <div class="path-box"><code id="nf-ui" data-full="SETTINGS → Custom Shaders Patch → COCKPIT (NECK FX)">SETTINGS → Custom Shaders Patch → COCKPIT (NECK FX)</code><button class="copy-btn" data-copy="#nf-ui">📋</button></div>
          <p class="mt-2" data-fa="تیک <strong>Active</strong> را برای «Replace old CSP implementation with a custom script» فعال کن." data-en="Enable <strong>Active</strong> for "Replace old CSP implementation with a custom script"."></p>
        </div></div>
      </div>
      <div class="warning"><span class="w-ico">⚠️</span><div><strong data-fa="اگر Active خاموش باشد" data-en="If Active is off"></strong>
        <span data-fa="افکت گردن اعمال نمی‌شود." data-en="the neck effect won't apply."></span></div></div>

      <h3 data-fa="عکس راهنما" data-en="Reference image"></h3>
      <figure class="guide-shot">
        <img class="js-lightbox" src="../assets/guides/08-neck-fx/neck-fx-setting.jpg" data-caption="Cockpit (Neck FX) Active" alt="تنظیمات Neck FX">
        <figcaption data-fa="CUSTOM SHADERS PATCH → منوی COCKPIT (NECK FX) → Active (دایره) · فلش SETTINGS" data-en="CUSTOM SHADERS PATCH → COCKPIT (NECK FX) menu → Active (circle) · SETTINGS arrow"></figcaption>
      </figure>
    </div>
