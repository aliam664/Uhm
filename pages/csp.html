<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بخش ۲ — CSP Setting | UHM Graphics Pack</title>
  <meta name="description" content="آموزش اعمال پریست Custom Shaders Patch برای پک گرافیکی UHM.">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>window.UHM_BASE="../";</script>
</head>
<body data-page="csp" data-lang="fa">

  <div id="scroll-progress"></div>
  <div id="header-mount"></div>
  <div id="sidebar-mount"></div>

  <main class="guide-wrap">
    <div class="guide-head">
      <nav class="crumbs"><a href="../index.html">خانه</a><span class="sep">/</span><span>بخش ۲</span></nav>
      <h1 class="guide-title"><span class="g-num">02</span><span data-fa="CSP Setting" data-en="CSP Setting"></span><span class="badge-photo">🖼 با عکس</span></h1>
      <p class="guide-desc" data-fa="کپی پریست CSP پک و اعمال آن در Content Manager." data-en="Copy the pack's CSP preset and apply it in Content Manager."></p>
      <div class="guide-meta"><span class="chip blue" data-fa="پیش‌نیاز: بخش ۱" data-en="Requires: Section 1"></span></div>
    </div>

    <div class="guide-body">
      <h3 data-fa="۱) کپی پریست" data-en="1) Copy the preset"></h3>
      <p data-fa="فایل Preset را در مسیر زیر کپی کن (نام کاربری ویندوز را جایگزین کن):" data-en="Copy the Preset file to this path (replace your Windows username):"></p>
      <div class="path-box">
        <code data-copy-target="csp-path" data-full="C:\Users\نام کاربری ویندوز\AppData\Local\AcTools Content Manager\Presets\Custom Shaders Patch Presets" id="csp-path">C:\Users\نام کاربری ویندوز\AppData\Local\AcTools Content Manager\Presets\Custom Shaders Patch Presets</code>
        <button class="copy-btn" data-copy="#csp-path">📋 <span data-fa="کپی مسیر" data-en="Copy"></span></button>
      </div>
      <div class="notice"><span class="n-ico">💡</span><div><span data-fa="پوشه AppData معمولاً مخفی است؛ از منوی View گزینه Hidden Items را فعال کن." data-en="AppData is usually hidden; enable Hidden Items from the View menu."></span></div></div>

      <h3 data-fa="۲) اعمال در Content Manager" data-en="2) Apply in Content Manager"></h3>
      <p data-fa="مسیر زیر را باز کن:" data-en="Open this path:"></p>
      <div class="path-box"><code id="csp-ui-path" data-full="SETTINGS → Custom Shaders Patch → General Settings">SETTINGS → Custom Shaders Patch → General Settings</code><button class="copy-btn" data-copy="#csp-ui-path">📋</button></div>
      <p data-fa="در پایینِ سمت راست، از بخش Presets یکی از نسخه‌های پک را انتخاب و اعمال کن:" data-en="At the bottom right, under Presets, choose and apply one of the pack versions:"></p>
      <div class="steps" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));display:grid">
        <div class="step"><div class="step-num">L</div><div class="step-body"><h4>Low End PC</h4></div></div>
        <div class="step"><div class="step-num">L</div><div class="step-body"><h4>Low</h4></div></div>
        <div class="step"><div class="step-num">M</div><div class="step-body"><h4>Medium</h4></div></div>
        <div class="step"><div class="step-num">H</div><div class="step-body"><h4>High</h4></div></div>
        <div class="step"><div class="step-num">U</div><div class="step-body"><h4>Ultra</h4></div></div>
      </div>

      <h3 data-fa="عکس راهنما" data-en="Reference image"></h3>
      <figure class="guide-shot">
        <img class="js-lightbox" src="../assets/guides/01-csp/csp-setting.jpg" data-caption="انتخاب پریست CSP در Content Manager" alt="انتخاب پریست CSP">
        <figcaption data-fa="SETTINGS (بالا راست) + تب CUSTOM SHADERS PATCH → General Settings → منوی Preset پایین راست" data-en="SETTINGS (top right) + CUSTOM SHADERS PATCH tab → General Settings → Preset dropdown bottom right"></figcaption>
      </figure>
    </div>

    <div id="pager-mount"></div>
  </main>

  <div id="footer-mount"></div>
  <button class="to-top" id="to-top" aria-label="برو بالا">↑</button>
  <div class="toast" id="toast"></div>

  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/gallery.js"></script>
</body>
</html>
