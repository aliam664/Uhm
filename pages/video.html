<body data-page="video" data-lang="fa">

  <div id="scroll-progress"></div>
  <div id="header-mount"></div>
  <div id="sidebar-mount"></div>

  <main class="guide-wrap">
    <div class="guide-head">
      <nav class="crumbs"><a href="../index.html">خانه</a><span class="sep">/</span><span>بخش ۵</span></nav>
      <h1 class="guide-title"><span class="g-num">05</span><span data-fa="Video Setting" data-en="Video Setting"></span><span class="badge-photo">🖼 با عکس</span></h1>
      <p class="guide-desc" data-fa="اعمال پریست ویدیو برای اجرای روان و باکیفیت." data-en="Apply the video preset for smooth, high-quality rendering."></p>
      <div class="guide-meta"><span class="chip blue" data-fa="پیش‌نیاز: بخش ۲" data-en="Requires: Section 2"></span></div>
    </div>

    <div class="guide-body">
      <h3 data-fa="۱) کپی پریست ویدیو" data-en="1) Copy the video preset"></h3>
      <p data-fa="فایل Video Settings را در مسیر زیر کپی کن:" data-en="Copy the Video Settings file to this path:"></p>
      <div class="path-box"><code id="vid-path" data-full="C:\Users\نام کاربری ویندوز\AppData\Local\AcTools Content Manager\Presets\Video Settings">C:\Users\نام کاربری ویندوز\AppData\Local\AcTools Content Manager\Presets\Video Settings</code><button class="copy-btn" data-copy="#vid-path">📋</button></div>

      <h3 data-fa="۲) اعمال" data-en="2) Apply"></h3>
      <div class="path-box"><code id="vid-ui" data-full="SETTINGS → Assetto Corsa → Video">SETTINGS → Assetto Corsa → Video</code><button class="copy-btn" data-copy="#vid-ui">📋</button></div>
      <p data-fa="در پایین سمت راست، از بخش Presets یکی از نسخه‌های پک را انتخاب و اعمال کن:" data-en="At the bottom right, under Presets, choose and apply one of the pack versions:"></p>
      <div class="steps" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));display:grid">
        <div class="step"><div class="step-num">L</div><div class="step-body"><h4>Low End PC</h4></div></div>
        <div class="step"><div class="step-num">L</div><div class="step-body"><h4>Low</h4></div></div>
        <div class="step"><div class="step-num">M</div><div class="step-body"><h4>Medium</h4></div></div>
        <div class="step"><div class="step-num">H</div><div class="step-body"><h4>High</h4></div></div>
        <div class="step"><div class="step-num">U</div><div class="step-body"><h4>Ultra</h4></div></div>
      </div>

      <h3 data-fa="عکس راهنما" data-en="Reference image"></h3>
      <figure class="guide-shot">
        <img class="js-lightbox" src="../assets/guides/04-video/video-setting.jpg" data-caption="انتخاب پریست ویدیو در Content Manager" alt="تنظیمات ویدیو">
        <figcaption data-fa="تب ASSETTO CORSA + منوی VIDEO · منوی Preset پایین با لیست Uhm Private video · فیلتر نمونه NFS 2015 Edited By Uhm" data-en="ASSETTO CORSA tab + VIDEO menu · Preset dropdown with the Uhm Private video list · sample filter NFS 2015 Edited By Uhm"></figcaption>
      </figure>
    </div>
