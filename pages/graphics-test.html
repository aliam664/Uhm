  <script>
    UHM.mountPageNav("graphics-test");
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll("#graphicsGallery .gallery-item"));
      if (!items.length) return;
      var sources = items.map(function (el) {
        return el.getAttribute("data-src") || el.querySelector("img").src;
      });
      var lb = document.getElementById("lightbox");
      var lbImg = document.getElementById("lightboxImg");
      var idx = 0;

      function show(i) {
        idx = (i + sources.length) % sources.length;
        lbImg.src = sources[idx];
        lb.hidden = false;
        document.body.style.overflow = "hidden";
      }
      function hide() {
        lb.hidden = true;
        document.body.style.overflow = "";
      }

      items.forEach(function (el, i) {
        el.addEventListener("click", function () { show(i); });
      });
      document.getElementById("lightboxClose").addEventListener("click", hide);
      document.getElementById("lightboxPrev").addEventListener("click", function () { show(idx - 1); });
      document.getElementById("lightboxNext").addEventListener("click", function () { show(idx + 1); });
      lb.addEventListener("click", function (e) { if (e.target === lb) hide(); });
      document.addEventListener("keydown", function (e) {
        if (lb.hidden) return;
        if (e.key === "Escape") hide();
        if (e.key === "ArrowLeft") show(idx + 1);
        if (e.key === "ArrowRight") show(idx - 1);
      });
    })();
  </script>
