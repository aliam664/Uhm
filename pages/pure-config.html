<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بخش ۴ — Pure Config | UHM Graphics Pack</title>
  <meta name="description" content="آموزش اعمال کانفیگ پک UHM در Pure برای Assetto Corsa.">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>window.UHM_BASE="../";</script>
</head>
<body data-page="pure-config" data-lang="fa">

  <div id="scroll-progress"></div>
  <div id="header-mount"></div>
  <div id="sidebar-mount"></div>

  <main class="guide-wrap">
    <div class="guide-head">
      <nav class="crumbs"><a href="../index.html">خانه</a><span class="sep">/</span><span>بخش ۴</span></nav>
      <h1 class="guide-title"><span class="g-num">04</span><span data-fa="Pure Config" data-en="Pure Config"></span><span class="badge-photo">🖼 با عکس</span></h1>
      <p class="guide-desc" data-fa="اعمال کانفیگ نهایی پک UHM روی Pure داخل بازی." data-en="Apply the final UHM pack config on Pure in-game."></p>
      <div class="guide-meta"><span class="chip blue" data-fa="پیش‌نیاز: بخش ۱ (نصب Pure)" data-en="Requires: Section 1 (Install Pure)"></span></div>
    </div>

    <div class="guide-body">
      <h3 data-fa="۱) کپی فایل کانفیگ" data-en="1) Copy the config file"></h3>
      <p data-fa="فایل Config را در مسیر زیر کپی کن:" data-en="Copy the Config file to this path:"></p>
      <div class="path-box"><code id="pc-path" data-full="\SteamLibrary\steamapps\common\assettocorsa\extension\config-ext\Pure">\SteamLibrary\steamapps\common\assettocorsa\extension\config-ext\Pure</code><button class="copy-btn" data-copy="#pc-path">📋</button></div>
      <div class="notice"><span class="n-ico">💡</span><div><span data-fa="اگر پوشه Pure نبود، آن را بساز. خود Pure باید از قبل نصب باشد." data-en="If the Pure folder doesn't exist, create it. Pure must already be installed."></span></div></div>

      <h3 data-fa="۲) اعمال داخل بازی" data-en="2) Apply in-game"></h3>
      <div class="steps">
        <div class="step"><div class="step-num">1</div><div class="step-body"><h4 data-fa="اجرای بازی" data-en="Run the game"></h4></div></div>
        <div class="step"><div class="step-num">2</div><div class="step-body"><h4 data-fa="باز کردن پنل" data-en="Open the panel"></h4><p data-fa="از نوار کناری سمت چپ بازی، پنل Pure Config را باز کن." data-en="Open the Pure Config panel from the left in-game sidebar."></p></div></div>
        <div class="step"><div class="step-num">3</div><div class="step-body"><h4 data-fa="IMPORT" data-en="IMPORT"></h4><p data-fa="روی دکمه IMPORT کلیک کن." data-en="Click the IMPORT button."></p></div></div>
        <div class="step"><div class="step-num">4</div><div class="step-body"><h4 data-fa="انتخاب کانفیگ" data-en="Select config"></h4><p data-fa="فایل <code>Uhm Private Config.ini</code> را انتخاب کن." data-en="Select the <code>Uhm Private Config.ini</code> file."></p></div></div>
        <div class="step"><div class="step-num">5</div><div class="step-body"><h4 data-fa="SAVE" data-en="SAVE"></h4><p data-fa="روی SAVE کلیک کن تا تنظیمات اعمال و ذخیره شوند." data-en="Click SAVE to apply and save the settings."></p></div></div>
      </div>

      <h3 data-fa="عکس‌های راهنما" data-en="Reference images"></h3>
      <figure class="guide-shot">
        <img class="js-lightbox" src="../assets/guides/03-pure-config/01-click-import.jpg" data-caption="دکمه IMPORT پایین پنجره Pure Config" alt="دکمه IMPORT">
        <figcaption data-fa="دکمه IMPORT پایین پنجره Pure Config" data-en="The IMPORT button at the bottom of the Pure Config window"></figcaption>
      </figure>
      <figure class="guide-shot">
        <img class="js-lightbox" src="../assets/guides/03-pure-config/02-select-uhm-config.jpg" data-caption="انتخاب Uhm Private Config.ini در مسیر Pure" alt="انتخاب کانفیگ">
        <figcaption data-fa="انتخاب Uhm Private Config.ini (هایلایت قرمز) در مسیر Pure" data-en="Selecting Uhm Private Config.ini (red highlight) in the Pure path"></figcaption>
      </figure>
    </div>

    <div id="pager-mount"></div>
  </main>

  <div id="footer-mount"></div>
  <button class="to-top" id="to-top" aria-label="برو بالا">↑</button>
  <div class="toast" id="toast"></div>

  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/gallery.js"></script>
</body>
</html>
